<!doctype html>
<html lang="zh-CN">

    <title>正在维护</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family:
          system-ui,
          -apple-system,
          'PingFang SC',
          sans-serif;
        background: #f7f7f5;
        color: #1c1c1c;
      }
      main {
        max-width: 26rem;
        padding: 2rem;
