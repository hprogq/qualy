# Coverage is shown, never enforced: the statuses are informational, and
# pull requests get no comment and no patch check. ci.yml uploads the node
# and Chromium reports of one run; Codecov merges them by flag.
coverage:
  status:
    project:
      default:
        informational: true
    patch: off

comment: false

flags:
  node:
    carryforward: false
  browser:
    carryforward: false
