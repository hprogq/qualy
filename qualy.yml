version: 3

# The product manifest: which of the installed plugins form this product, and
# how each is configured. Where the plugins are installed is not this file's
# to say - they resolve from the package this file sits in, whose
# package.json declares them. Configuration that changes the assembly lives
# here and is hashed into the lock; settings that only change how the
# process behaves belong under `application` or in the environment.

plugins:
  # The product's one lineage is db/migrations beside this file, and the
  # connection is DATABASE_URL; neither is configured here.
  '@qualy/plugin-database': {}
  # Values kept encrypted, such as a login entrance's client secret. The master
  # key is QUALY_SECRETS_MASTER_KEY and is never configured here.
  '@qualy/plugin-secrets': {}

  '@qualy/plugin-ui-registry': {}
  '@qualy/plugin-web': {}
  '@qualy/plugin-layout-default': {}

  '@qualy/plugin-org': {}
  '@qualy/plugin-auth': {}
  '@qualy/plugin-auth-local': {}
  '@qualy/plugin-rbac': {}

  # Attachments: what one is, and where its bytes go. The second question is a
  # deployment's to answer, which is why the backends are separate plugins -
  # install the ones this machine can reach, and name the one new uploads are
  # written to. Everything already written stays readable through the backend
  # that wrote it.
  '@qualy/plugin-storage':
    config:
      defaultBackend: local
  '@qualy/plugin-storage-local': {}
  '@qualy/plugin-storage-cos':
    enabled: false
    config:
      region: ap-beijing
      bucket: qualy-dev-files-1301296774

  # Browser failure reporting. The capability owns the vocabulary the runtime
  # reports through and answers whether this deployment reports at all; where
  # the reports go is a provider's, and at most one provider may be enabled -
  # the assembly refuses two by name. Switching platforms is one line here,
  # with no change to any screen.
  #
  # The capability stays on with no provider selected, which is what makes
  # that one line enough: the endpoint answers "nobody", the browser stops
  # there, and no vendor bundle is ever fetched. Turning reporting on needs a
  # project to report to, which a development machine does not have - so the
  # provider is off here, and a deployment that wants it enables the provider
  # and sets QUALY_RUM_TENCENT_ID.
  '@qualy/plugin-rum': {}
  '@qualy/plugin-rum-tencent':
    enabled: false

  '@qualy/plugin-assessment': {}
  '@qualy/plugin-assessment-evidence': {}
  '@qualy/plugin-audit': {}
  '@qualy/plugin-sandbox': {}
  '@qualy/plugin-assessment-formula':
    config:
      # Deployment B (2026-09-12): new formula bindings are open; the writer
      # was enabled after the existing-state audit came back clean. Set to
      # false to close it again - questions already bound keep running.
      authoring: true
  '@qualy/plugin-settings': {}
  '@qualy/plugin-directory-import': {}
  '@qualy/plugin-auth-cas': {}
  '@qualy/plugin-auth-github': {}
  '@qualy/plugin-auth-oidc': {}

  # Mail, the same shape as attachments: the backends are separate plugins,
  # and the one mail goes out through is named here as the product's default.
  # A deployment names another with QUALY_MAIL_DEFAULT_BACKEND, among the
  # backends enabled here, without a new release - development sets smtp and
  # hands mail to the local Mailpit. Only the backend that sends needs its
  # relay or key; the other one waits unconfigured.
  '@qualy/plugin-mail':
    config:
      defaultBackend: resend
  '@qualy/plugin-mail-smtp': {}
  '@qualy/plugin-mail-resend': {}

  # Challenges for risky requests. Unlike mail, which provider answers them is
  # chosen by enabling it rather than by name: each provider brings its own
  # browser code, and Turnstile its own script origin in the page's CSP, so
  # the choice is part of the web release. At most one provider may be
  # enabled - the assembly refuses two by name.
  '@qualy/plugin-captcha': {}
  '@qualy/plugin-captcha-altcha': {}
  '@qualy/plugin-captcha-turnstile':
    enabled: false
