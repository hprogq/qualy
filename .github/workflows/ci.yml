name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # this job provisions a postgres service: integration tests must not
      # silently skip when it is unreachable
      QUALY_REQUIRE_POSTGRES_TESTS: '1'
    services:
      postgres:
        # same image as the local compose stack
        image: pgvector/pgvector:pg18-bookworm
        env:
          POSTGRES_USER: qualy
          POSTGRES_PASSWORD: qualy
          POSTGRES_DB: qualy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qualy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the loader entry list is generated and gitignored, so it has to exist
      # before the frozen check can compare against it
      - run: pnpm gen
      - name: assembly lock must describe this tree
        run: pnpm qualy resolve --frozen-lockfile
      - run: pnpm typecheck
      - name: capability artifacts must be conflict free
        run: pnpm qualy database check
      - name: no-op generate must leave artifacts clean
        run: |
          pnpm qualy generate
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi
      - name: drop guard
        run: pnpm qualy database drop-guard
      # Before the build, deliberately. A suite that needs the frontend built
      # is a suite coupled to it, and the web plugin's own tests were: they
      # pointed at client-dist and died here with WebUnservable. Reordering
      # this would have hidden that instead of fixing it, and made every test
      # run wait for a bundle.
      - run: pnpm test
      - name: build web superset and stage assets
        run: pnpm build
      - name: staged web assets must exist
        run: test -f packages/plugins/infra/web/client-dist/index.html
      - name: plugin chunk sentinel
        run: pnpm exec tsx apps/web/scripts/check-chunks.ts
