name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen
      - run: pnpm typecheck
      - name: migration conflict check
        run: pnpm exec drizzle-kit check
      - name: no-op generate must leave migrations clean
        run: |
          pnpm exec drizzle-kit generate
          status="$(git status --porcelain -- db/migrations)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi
      - name: drop guard
        run: pnpm exec tsx scripts/drop-guard.ts --all
      - run: pnpm test
      - name: build web superset and stage assets
        run: pnpm build
      - name: staged web assets must exist
        run: test -f packages/plugins/infra/web/client-dist/index.html
      - name: plugin chunk sentinel
        run: pnpm exec tsx apps/web/scripts/check-chunks.ts
