name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # this job provisions a postgres service: integration tests must not
      # silently skip when it is unreachable
      QUALY_REQUIRE_POSTGRES_TESTS: '1'
      # One on-disk V8 compile cache for every node process in this job.
      # This tree runs as type-stripped sources with no bundler, so each
      # process - the vitest host, every forked backend and vite child, the
      # production smoke - pays module compilation from scratch: measured at
      # ~2 minutes for the vitest import graph on these 2-core runners
      # (~1.4s warm locally), which is what has been tipping the db-backed
      # suites over their timeouts one at a time. The first step fills the
      # cache; everything after it reuses compiled bytecode. Probed locally:
      # stripped-type modules do land in the cache.
      # a fixed path: the runner context is not available in job-level env
      NODE_COMPILE_CACHE: /tmp/node-compile-cache
    services:
      postgres:
        # same image as the local compose stack
        image: pgvector/pgvector:pg18-bookworm
        env:
          POSTGRES_USER: qualy
          POSTGRES_PASSWORD: qualy
          POSTGRES_DB: qualy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qualy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same trade the compose stack makes, for the same reason: this
      # database exists for the length of one job and every test commits.
      # A service container takes no command, so the settings are applied
      # afterwards - all three are reloadable, no restart involved.
      - name: a database nobody has to recover
        env:
          PGPASSWORD: qualy
        run: |
          for setting in fsync=off synchronous_commit=off full_page_writes=off; do
            psql -h localhost -U qualy -d qualy -c "alter system set ${setting/=/ = }"
          done
          psql -h localhost -U qualy -d qualy -c 'select pg_reload_conf()'
      - name: assembly lock must describe this tree
        run: pnpm qualy resolve --frozen-lockfile
      - run: pnpm typecheck
      - name: capability artifacts must be conflict free
        run: pnpm qualy database check
      - name: no-op generate must leave artifacts clean
        run: |
          pnpm qualy generate
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi
      - name: drop guard
        run: pnpm qualy database drop-guard
      # Before the build, deliberately. A suite that needs the frontend built
      # is a suite coupled to it, and the web plugin's own tests were: they
      # pointed at client-dist and died here with WebUnservable. Reordering
      # this would have hidden that instead of fixing it, and made every test
      # run wait for a bundle.
      - run: pnpm test
      - name: build web superset and stage assets
        run: pnpm build
      - name: staged web assets must exist
        run: test -f packages/plugins/infra/web/client-dist/index.html
      - name: plugin chunk sentinel
        run: node apps/web/scripts/check-chunks.ts
      # The descriptor model gave up the compile-time closure proof; a real
      # production boot is the trust boundary now. Staged assets carry the
      # assembly's resolutionHash and the process refuses a mismatch, so this
      # also proves the bundle and the assembly agree.
      # a production start applies nothing; the lineage lands the way a
      # deployment lands it, then the boot is asserted against the result
      - name: deploy the lineage
        env:
          DATABASE_URL: postgres://qualy:qualy@localhost:5432/qualy
        run: pnpm qualy deploy
      - name: production boot serves the staged assembly
        env:
          DATABASE_URL: postgres://qualy:qualy@localhost:5432/qualy
        run: node tools/quality/smoke-production.ts

  # The component suite, in the one environment that is always cold. Its
  # whole failure class - dependency scanning, chunk graphs, one react
  # instance - only ever showed up on a fresh cache, which a developer
  # machine almost never is. No postgres: components talk to stubbed
  # clients, so this leg runs parallel to the integration job.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: resolve playwright version
        id: playwright
        run: echo "version=$(node -e "console.log(require('playwright/package.json').version)")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}
      - name: install chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
