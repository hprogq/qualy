name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # this job provisions a postgres service: integration tests must not
      # silently skip when it is unreachable
      QUALY_REQUIRE_POSTGRES_TESTS: '1'
      QUALY_REQUIRE_MAILPIT_TESTS: '1'
      # One on-disk V8 compile cache for every node process in this job.
      # This tree runs as type-stripped sources with no bundler, so each
      # process - the vitest host, every forked backend and vite child, the
      # production smoke - pays module compilation from scratch: measured at
      # ~2 minutes for the vitest import graph on these 2-core runners
      # (~1.4s warm locally), which is what has been tipping the db-backed
      # suites over their timeouts one at a time. The first step fills the
      # cache; everything after it reuses compiled bytecode. Probed locally:
      # stripped-type modules do land in the cache.
      # a fixed path: the runner context is not available in job-level env
      NODE_COMPILE_CACHE: /tmp/node-compile-cache
    services:
      postgres:
        # same image as the local compose stack
        image: pgvector/pgvector:pg18-bookworm@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_USER: qualy
          POSTGRES_PASSWORD: qualy
          POSTGRES_DB: qualy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qualy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # the smtp mail backend's contract suite delivers here and reads the
      # messages back through its api
      mailpit:
        image: axllent/mailpit:v1.31.2
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm
      # The compile cache below is filled by the first step of every run and
      # then thrown away with the runner, so every run paid for it and no run
      # arrived with one. Keyed by what decides its contents - the node that
      # wrote the bytecode and the dependency set that was compiled - and
      # restored from the newest near miss, because a cache that is mostly
      # right still saves most of the compiling.
      - uses: actions/cache@v4
        with:
          path: /tmp/node-compile-cache
          key: node-compile-24.20.0-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-compile-24.20.0-
      - run: pnpm install --frozen-lockfile
      # The same trade the compose stack makes, for the same reason: this
      # database exists for the length of one job and every test commits.
      # A service container takes no command, so the settings are applied
      # afterwards - all four are reloadable, no restart involved.
      #
      # log_lock_waits is for the teardown that occasionally stays open: a
      # session waiting on a lock past deadlock_timeout is otherwise silent
      # on the server, and the container log is the one thing a finished
      # job still lets us read.
      - name: a database nobody has to recover
        env:
          PGPASSWORD: qualy
        run: |
          for setting in fsync=off synchronous_commit=off full_page_writes=off log_lock_waits=on; do
            psql -h localhost -U qualy -d qualy -c "alter system set ${setting/=/ = }"
          done
          psql -h localhost -U qualy -d qualy -c 'select pg_reload_conf()'
      - name: assembly lock must describe this tree
        run: pnpm qualy resolve --frozen-lockfile
      # A committed migration is history: between the base of this change and
      # its head the lineage may only grow. Editing or removing one is a new
      # migration's job (docs/deployment.md, release verification 5).
      # A force push leaves the pushed-over commit out of the clone; GitHub
      # still serves it by id, so it is fetched rather than skipped.
      - name: committed migrations only grow
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git cat-file -e "$BASE^{commit}" 2>/dev/null || git fetch --no-tags --quiet origin "$BASE" || true
          node tools/quality/check-migrations-immutable.ts "$BASE"
      - run: pnpm typecheck
      - name: capability artifacts must be conflict free
        run: pnpm qualy database check
      # CI generates nothing. It replays the committed lineage onto a scratch
      # database, builds the declared schema on another, and requires the two
      # to be identical with no baseline fragment left uncompiled: a developer
      # who changed an entity generates the migration, reviews it and commits
      # it, and this is where forgetting that fails.
      - name: the committed lineage must build the declared schema
        run: pnpm qualy database verify
      - name: drop guard
        run: pnpm qualy database drop-guard
      # Before the build, deliberately. A suite that needs the frontend built
      # is a suite coupled to it, and the web plugin's own tests were: they
      # pointed at client-dist and died here with WebUnservable. Reordering
      # this would have hidden that instead of fixing it, and made every test
      # run wait for a bundle.
      - run: pnpm test
      - name: build web superset and stage assets
        run: pnpm build
      - name: the staged web release is whole
        run: node tools/quality/check-staged-web.ts
      - name: plugin chunk sentinel
        run: node apps/web/scripts/check-chunks.ts
      - name: no code from strings in the bundle
        run: node tools/quality/check-csp-build.ts
      - name: the public artifact discloses nothing it should not
        run: node tools/quality/check-public-web.ts
      # The descriptor model gave up the compile-time closure proof; a real
      # production boot is the trust boundary now. Staged assets carry the
      # assembly's resolutionHash and the process refuses a mismatch, so this
      # also proves the bundle and the assembly agree.
      # a production start applies nothing; the committed lineage lands the
      # way a deployment lands it, then the boot is asserted against the result
      - name: deploy the lineage
        env:
          DATABASE_URL: postgres://qualy:qualy@localhost:5432/qualy
        run: pnpm qualy deploy
      - name: production boot serves the staged assembly
        env:
          DATABASE_URL: postgres://qualy:qualy@localhost:5432/qualy
        run: node tools/quality/smoke-production.ts
      # the policy the shell sends is only known to be enforceable by a
      # browser running the page under it: chromium opens the boot graph
      # against a host that enforces rather than reports
      - name: resolve playwright version
        id: playwright
        run: echo "version=$(node -e "console.log(require('playwright/package.json').version)")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}
      - name: install chromium
        run: pnpm exec playwright install --with-deps chromium
      # The pages worth opening under an enforced policy are the signed-in
      # ones - the only Workers in the tree are the code editor's, and
      # worker-src is the directive most likely to be broken - so there has
      # to be somebody to sign in as. Without this the check reached the
      # login page alone and reported no violations, which read as coverage
      # it did not have.
      - name: an administrator to sign in as
        env:
          DATABASE_URL: postgres://qualy:qualy@localhost:5432/qualy
          QUALY_ADMIN_EMAIL: admin@ci.example
          QUALY_ADMIN_PASSWORD: csp-smoke-only
        run: pnpm seed
      - name: the content security policy can be enforced
        env:
          DATABASE_URL: postgres://qualy:qualy@localhost:5432/qualy
          QUALY_ADMIN_EMAIL: admin@ci.example
          QUALY_ADMIN_PASSWORD: csp-smoke-only
          # and it may not quietly fall back to the login page here
          CSP_REQUIRE_SIGNED_IN: '1'
        run: node tools/quality/check-csp-enforce.ts

  # The component suite, in the one environment that is always cold. Its
  # whole failure class - dependency scanning, chunk graphs, one react
  # instance - only ever showed up on a fresh cache, which a developer
  # machine almost never is. No postgres: components talk to stubbed
  # clients, so this leg runs parallel to the integration job.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: resolve playwright version
        id: playwright
        run: echo "version=$(node -e "console.log(require('playwright/package.json').version)")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}
      - name: install chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser

  # The cold start and the brand once more in WebKit: the two screens whose
  # defects were engine timing, not logic, and which Chromium hid. A smoke
  # leg of two files, not the suite - see vitest.browser.webkit.config.ts.
  browser-webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: resolve playwright version
        id: playwright
        run: echo "version=$(node -e "console.log(require('playwright/package.json').version)")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ steps.playwright.outputs.version }}
      - name: install webkit
        run: pnpm exec playwright install --with-deps webkit
      - run: pnpm test:browser:webkit

  # The release, built the way a release is built - the server image and the
  # two sandbox images, one tag - and then treated the way a deployment
  # treats it. The server image is inspected from the outside first: this
  # checkout's manifest, lock and lineage inside, nothing of the development
  # toolchain, the assembly resolving against its own lock with nothing
  # mounted. Then deploy/compose.yaml runs the release on a throwaway
  # project: migrate, serve, reach both sandboxes, back up, restore, serve
  # again. No pnpm install here on purpose: a release is used, not built
  # upon, and the three scripts import nothing beyond node.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          # setup-node reads packageManager from package.json and would run
          # pnpm to key a cache; there is no pnpm on this runner and nothing
          # to cache
          package-manager-cache: false
      - name: build the release images, and inspect the server image
        run: node tools/release/build-images.ts ci --check
      - name: the release deploys, migrates, serves, backs up and restores
        run: node tools/quality/release-smoke.ts ci
