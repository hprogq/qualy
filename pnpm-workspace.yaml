packages:
  - packages/core/*
  - packages/contracts/*
  - packages/web/*
  - packages/build/*
  - packages/testkit/*
  - packages/plugins/*/*
  - apps/*
  # A third party's plugin, dist-only, which owns a browser test of its own.
  # Named rather than globbed: the fixture next to it proves that a plugin
  # this workspace has never installed still resolves, so it must stay out.
  - tools/fixtures/acme-browser-probe
allowBuilds:
  argon2: true
  cos-js-sdk-v5: false
  esbuild: true
  msgpackr-extract: false
catalog:
  # read by the staged-web gate, which re-minifies the served css to ask
  # whether the build left anything undone
  lightningcss: 1.33.0
  '@types/node': 24.13.3
  chokidar: 5.0.0
  typescript: 7.0.2
  # instance validation for the value-schema scoring contracts (json schema
  # 2020-12 plus the x-qualy-* keywords); the assignability prover next to it
  # is hand-written, ajv only judges single values
  ajv: 8.20.0
  # the frozen regex engine behind the value-schema pattern keyword: RE2
  # semantics in pure JS, linear-time matching, identical in Node and the
  # browser - part of the scoring-contract interpreter, pinned like one
  re2js: 2.8.6
  # the scoring sandbox engine, three parts that move as one version: the
  # core drives a QuickJS compiled to WASM; the release variant runs
  # formulas, the debug variant double-runs the escape suite in tests
  quickjs-emscripten-core: 0.32.0
  '@jitl/quickjs-wasmfile-release-sync': 0.32.0
  '@jitl/quickjs-wasmfile-debug-sync': 0.32.0
  # bundles admin formulas into self-contained sandbox artifacts at publish
  # time; a runtime dependency of the formula plugin, not just tooling
  esbuild: 0.28.2
  # the reader's syntax highlighting: a formula template is somebody else's
  # code being read, not edited, and Monaco is the editor's chunk. Taken in
  # fine grains - the core, the JS regex engine, the TypeScript grammar -
  # so no other language, theme or wasm engine reaches the browser. The two
  # packages move as one version: langs are built against the core's types
  shiki: 4.4.3
  '@shikijs/langs': 4.4.3
  # reads and writes the administrative import workbook, server-side only:
  # the template a recorder downloads and the file they send back. It never
  # reaches the browser - the parser lives behind the api, because a
  # workbook parsed in the browser and posted as json is a workbook the
  # stored original no longer accounts for
  exceljs: 4.4.0
  tsx: 4.23.1
  # every @mikro-orm package sits on one version: the driver re-exports core's
  # types, and two copies of core would make an entity defined against one
  # unassignable to the other
  '@mikro-orm/core': 7.1.13
  '@mikro-orm/postgresql': 7.1.13
  '@mikro-orm/migrations': 7.1.13
  # pinned by @mikro-orm/sql, which depends on an exact kysely; two copies would
  # make a query builder from one unusable against the other
  kysely: 0.29.5
  # Effect v4 release candidate. Every effect package must sit on the SAME
  # version: the ecosystem peers on an exact prerelease. The modules this
  # project needs (httpapi, schema, observability) are exported from
  # effect/unstable/*, where a prerelease is still allowed to break them, so
  # upgrades go through scripts/vendor-sync.ts and a full gate run rather
  # than a version bump on its own. Moved to rc.115 with the test toolchain,
  # so @effect/vitest sits on the same release as the runtime it tests.
  effect: 4.0.0-rc.115
  '@effect/vitest': 4.0.0-rc.115
  '@effect/platform-node': 4.0.0-rc.115
  '@effect/tsgo': 0.36.4
  pg: 8.22.0
  '@types/pg': 8.20.0
  yaml: 2.9.0
  vitest: 5.0.1
  prettier: 3.9.6
  '@lingui/core': 6.6.0
  '@lingui/message-utils': 6.6.0
  react: 19.2.8
  react-dom: 19.2.8
  react-router: 8.3.0
  vite: 8.2.0
  '@vitejs/plugin-react': 6.0.5
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.4
  '@electric-sql/pglite': 0.5.4
  '@tanstack/react-query': 5.101.4
  sirv: 3.0.2
  argon2: 0.45.1
  clsx: 2.1.1
  '@vitest/browser-playwright': 5.0.1
  'vitest-browser-react': 2.3.0
  playwright: 1.62.1
  # UI platform migration (docs/ui-platform-migration-mantine.md): StyleX is
  # the styling compiler for product layout and visuals. One version across
  # the workspace - two copies of the stylex runtime would split the
  # injected CSS
  '@stylexjs/stylex': 0.19.1
  '@stylexjs/unplugin': 0.19.1
  # Mantine is the commodity widget substrate behind @qualy/ui (ADR 0010);
  # hooks is core's peer dependency and must match its version exactly
  '@mantine/core': 9.5.2
  '@mantine/dates': 9.5.2
  '@mantine/hooks': 9.5.2
  # the date components' own formatting engine; nothing else in the product
  # uses it, and no domain date logic moves onto it
  dayjs: 1.11.13
  # tencent cloud object storage, in three parts that never meet: the node sdk
  # is the control plane (head/delete/sign), the sts package mints the
  # exact-object upload credential, and the browser sdk is the only one that
  # ever touches the bytes
  cos-nodejs-sdk-v5: 3.0.0
  qcloud-cos-sts: 3.1.3
  cos-js-sdk-v5: 1.10.1
  # tencent cloud real user monitoring, browser only: the reporting sdk the
  # rum-tencent provider loads when a deployment has reporting switched on.
  # Pinned exactly, because a minor release of it changes what leaves a
  # browser - the behaviour that was actually verified is recorded in
  # docs/notes/aegis-web-sdk.md, and an upgrade repeats those checks.
  aegis-web-sdk: 1.41.15
  # the rum control plane, for the source map uploader a release pipeline runs.
  # The per-product package rather than `tencentcloud-sdk-nodejs`: the whole
  # sdk unpacks to 44 MB for three calls, and this one to 220 KB.
  tencentcloud-sdk-nodejs-rum: 4.1.281
minimumReleaseAgeExclude:
  - effect@4.0.0-rc.115
  - '@effect/vitest@4.0.0-rc.115'
  - '@effect/platform-node-shared@4.0.0-rc.115'
  - '@effect/platform-node@4.0.0-rc.115'
  - '@mikro-orm/core@7.1.13'
  - '@mikro-orm/migrations@7.1.13'
  - '@mikro-orm/postgresql@7.1.13'
  - '@mikro-orm/sql@7.1.13'
  - '@effect/tsgo-darwin-arm64@0.36.4'
  - '@effect/tsgo-darwin-x64@0.36.4'
  - '@effect/tsgo-linux-arm64@0.36.4'
  - '@effect/tsgo-linux-arm@0.36.4'
  - '@effect/tsgo-linux-x64@0.36.4'
  - '@effect/tsgo-win32-arm64@0.36.4'
  - '@effect/tsgo-win32-x64@0.36.4'
  - '@effect/tsgo@0.36.4'
  # The Vitest 5 line, whole. `@vitest/browser-playwright` peers on an exact
  # vitest, and `@vitest/browser` pulls the ui package for its orchestrator,
  # so this set moves together or not at all - a partial exemption would just
  # be an install that cannot resolve. Taken at 5.0.1 rather than 5.0.0 for
  # the self-referencing `extends` fix (the webkit config is one) and the
  # doctor's pool measurement.
  - '@vitest/browser-playwright@5.0.1'
  - '@vitest/browser@5.0.1'
  - '@vitest/mocker@5.0.1'
  - '@vitest/pretty-format@5.0.1'
  - '@vitest/spy@5.0.1'
  - '@vitest/ui@5.0.1'
  - '@vitest/utils@5.0.1'
  - vitest@5.0.1
patchedDependencies:
  '@stylexjs/unplugin@0.19.1': patches/@stylexjs__unplugin@0.19.1.patch
