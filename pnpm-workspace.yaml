packages:
  - packages/*
  - packages/plugins/*/*
  - apps/*
  # decision spike, deleted whichever way the orm question resolves
  - experiments/*
allowBuilds:
  argon2: true
  esbuild: true
  msgpackr-extract: false
catalog:
  '@types/node': 24.13.3
  typescript: ~6.0.3
  zod: 4.4.3
  tsx: 4.23.1
  drizzle-orm: 1.0.0-rc.4
  # vendored for the orm decision spike; nothing installs it yet
  '@mikro-orm/core': 7.1.10
  '@mikro-orm/postgresql': 7.1.10
  '@mikro-orm/migrations': 7.1.10
  kysely: 0.29.4
  drizzle-kit: 1.0.0-rc.4
  # Effect v4 beta. Every effect package must sit on the SAME version: the
  # ecosystem peers on an exact beta, and drizzle-orm's effect-postgres
  # requires >= 4.0.0-beta.83. The modules this project needs (httpapi, sql,
  # schema) are exported from effect/unstable/*, where a beta release is
  # allowed to break them, so upgrades go through scripts/vendor-sync.ts and
  # a full gate run rather than a version bump on its own.
  effect: 4.0.0-beta.103
  '@effect/sql-pg': 4.0.0-beta.103
  '@effect/vitest': 4.0.0-beta.103
  '@effect/platform-node': 4.0.0-beta.103
  '@effect/language-service': 0.87.1
  pg: 8.22.0
  '@types/pg': 8.20.0
  yaml: 2.9.0
  vitest: 4.1.10
  prettier: 3.9.6
  '@lingui/core': 6.6.0
  '@standard-schema/spec': 1.1.0
  '@lingui/message-utils': 6.6.0
  react: 19.2.8
  react-dom: 19.2.8
  react-router: 8.3.0
  vite: 8.2.0
  '@vitejs/plugin-react': 6.0.5
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.4
  '@electric-sql/pglite': 0.5.4
  '@tanstack/react-query': 5.101.4
  sirv: 3.0.2
  argon2: 0.45.1
  cookie: 2.0.1
  tailwindcss: 4.3.3
  '@tailwindcss/vite': 4.3.3
  class-variance-authority: 0.7.1
  tailwind-merge: 3.6.0
  clsx: 2.1.1
  '@radix-ui/react-slot': 1.3.3
  '@radix-ui/react-label': 2.1.15
  '@vitest/browser-playwright': 4.1.10
  'vitest-browser-react': 2.2.0
  playwright: 1.62.1
minimumReleaseAgeExclude:
  - '@effect/sql-pg@4.0.0-beta.103'
  - effect@4.0.0-beta.103
  - '@effect/vitest@4.0.0-beta.103'
  - '@effect/platform-node-shared@4.0.0-beta.103'
  - '@effect/platform-node@4.0.0-beta.103'
