services:
  postgres:
    image: pgvector/pgvector:pg18-bookworm
    container_name: qualy-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      LANG: en_US.utf8
    # A development database holds nothing that survives a crash: the schema
    # comes from the lineage and the rows come from the seed. Every test also
    # commits, hundreds of times per run, and waiting for the disk to confirm
    # each one is the single most expensive thing about the suite - turning
    # these three off took a full run from 15.8s to 11.5s.
    #
    # Never do this to a database anybody wants to keep: a crash leaves it
    # unrecoverable rather than merely behind.
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # postgres:18 series images keep the data volume at /var/lib/postgresql
      # (not the older /data subdirectory); adjust when downgrading the image
      - pg_data:/var/lib/postgresql
      - pg_backups:/backups
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pg_data: {}
  pg_backups: {}
