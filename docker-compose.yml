services:
  postgres:
    image: pgvector/pgvector:pg18-bookworm
    container_name: qualy-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      LANG: en_US.utf8
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # postgres:18 series images keep the data volume at /var/lib/postgresql
      # (not the older /data subdirectory); adjust when downgrading the image
      - pg_data:/var/lib/postgresql
      - pg_backups:/backups
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # The suite creates and drops a database per test - around a hundred and
  # fifty of them in one run - and those flush data files whatever
  # synchronous_commit says. Turning fsync off takes a full run from 15.8s to
  # 8.9s, and turning only synchronous_commit off buys nothing at all (15.9s,
  # measured). But a cluster that does not fsync can come back from a crash
  # unstartable rather than merely behind, so this is a database of its own:
  # it holds only scratch databases the tests build and drop, keeps no volume,
  # and the development data next door stays durable.
  postgres-test:
    image: pgvector/pgvector:pg18-bookworm
    container_name: qualy-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: qualy
      POSTGRES_PASSWORD: qualy
      POSTGRES_DB: qualy
      TZ: Asia/Shanghai
      LANG: en_US.utf8
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    ports:
      - '${POSTGRES_TEST_PORT:-5433}:5432'
    # tmpfs rather than a volume: nothing here outlives the container, which is
    # the same statement the settings above make
    tmpfs:
      - /var/lib/postgresql
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qualy -d qualy']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # The local observability stack, off by default:
  #
  #   docker compose --profile observability up -d
  #   OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318 pnpm dev
  #
  # The application only ever talks to the collector; the collector forwards
  # to the LGTM box (Tempo for traces, a Prometheus-compatible store for
  # metrics, Grafana on http://localhost:3001 to look at both). Production
  # keeps the exact same first hop and swaps what stands behind it, so
  # nothing about the application changes between the two. See
  # ops/observability/README.md.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    container_name: qualy-otel-collector
    restart: unless-stopped
    profiles: [observability]
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      # collector.local.yaml by default; set QUALY_COLLECTOR_CONFIG in .env
      # (or the shell) to collector.staging.yaml for the Tencent APM uplink
      - ./ops/observability/${QUALY_COLLECTOR_CONFIG:-collector.local.yaml}:/etc/otelcol/config.yaml:ro
    # vendor credentials reach the COLLECTOR container only, from a file git
    # never sees; the application's .env stays free of them
    env_file:
      - path: ./ops/observability/collector.env
        required: false
    ports:
      - '127.0.0.1:4317:4317'
      - '127.0.0.1:4318:4318'
      # the collector's own health_check extension; the image is FROM scratch,
      # so there is no shell for a docker healthcheck to exec - this port is
      # the probe: curl -sf http://127.0.0.1:13133
      - '127.0.0.1:13133:13133'
    depends_on:
      otel-lgtm:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  otel-lgtm:
    image: grafana/otel-lgtm:0.31.0
    container_name: qualy-otel-lgtm
    restart: unless-stopped
    profiles: [observability]
    ports:
      - '127.0.0.1:3001:3000'
    # diagnostics for a laptop, not a deployment: nothing kept here is worth
    # a volume, and a fresh start is a feature when the retention is hours
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://127.0.0.1:3000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  pg_data: {}
  pg_backups: {}
