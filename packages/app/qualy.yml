version: 1

plugins:
  '@cordisjs/plugin-logger-console': {}
  '@cordisjs/plugin-timer': {}

  '@cordisjs/plugin-hmr':
    config:
      base: '../..'
      root:
        - packages

  '@qualy/plugin-database':
    config:
      migrationsFolder: ../../db/migrations

  '@qualy/plugin-server':
    config:
      port: 3000
      prefix: /api

  '@qualy/plugin-ui-registry': {}
  '@qualy/plugin-web': {}
  '@qualy/plugin-layout-default': {}
  '@qualy/plugin-api-reference': {}

  '@qualy/plugin-org': {}
  '@qualy/plugin-auth': {}
  '@qualy/plugin-auth-local': {}
  '@qualy/plugin-rbac': {}
  '@qualy/plugin-dict': {}

  '@qualy/plugin-ping':
    config:
      greeting: hello
