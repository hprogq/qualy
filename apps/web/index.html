<!doctype html>
<html lang="zh-CN">
  <head>
    <style>
      @layer theme, base, mantine, components, priority1, priority2, priority3, priority4, priority5;
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Qualy: Plugin based comprehensive quality evaluation system"
    />
    <title>Qualy</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      ;(function () {
        var choice = null
        try {
          choice = localStorage.getItem('qualy.theme')
        } catch (error) {}
        var dark =
          choice === 'dark' ||
          (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        var root = document.documentElement
        root.setAttribute('data-mode', dark ? 'dark' : 'light')
        if (dark) root.classList.add('dark')
        root.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
    <style id="qualy-boot-style">
      html {
        background: oklch(1 0 0);
      }
      html[data-mode='dark'] {
        background: oklch(0.145 0 0);
      }
      #qualy-boot {
        position: fixed;
        inset: 0;
        background: oklch(1 0 0);
        color: oklch(0.145 0 0);
      }
      html[data-mode='dark'] #qualy-boot {
        background: oklch(0.145 0 0);
        color: oklch(0.985 0 0);
      }
      #qualy-boot > div {
        position: absolute;
        top: calc(44vh - 14.42px);
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
      }
      #qualy-boot svg {
        display: block;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
