<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="oklch(0.99 0.001 80)" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="oklch(0.17 0.006 80)" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Qualy: Plugin based comprehensive quality evaluation system"
    />
    <title>Qualy</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>
      @layer theme, base, mantine, components, priority1, priority2, priority3, priority4, priority5;
    </style>
    <script>
      ;(function () {
        var choice = null
        var stored = null
        try {
          choice = localStorage.getItem('qualy.theme')
          stored = localStorage.getItem('qualy.locale')
        } catch (error) {}
        var dark =
          choice === 'dark' ||
          (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        var root = document.documentElement
        root.setAttribute('data-mode', dark ? 'dark' : 'light')
        if (dark) root.classList.add('dark')
        root.style.colorScheme = dark ? 'dark' : 'light'
        var ground = dark ? 'oklch(0.17 0.006 80)' : 'oklch(0.99 0.001 80)'
        var chrome = document.querySelectorAll('meta[name="theme-color"]')
        for (var i = 0; i < chrome.length; i++) chrome[i].setAttribute('content', ground)
        var locales = ['zh-CN', 'en-US']
        var locale = locales.indexOf(stored) < 0 ? null : stored
        var languages = navigator.languages || [navigator.language]
        for (var j = 0; j < languages.length && locale === null; j++) {
          var language = String(languages[j] || '')
          if (locales.indexOf(language) >= 0) locale = language
          for (var k = 0; k < locales.length && locale === null; k++) {
            if (locales[k].split('-')[0] === language.split('-')[0]) locale = locales[k]
          }
        }
        if (locale === null) locale = 'zh-CN'
        root.lang = locale
        root.setAttribute('data-locale', locale)
        var shown = false
        function showRecovery(kind) {
          if (shown) return
          var boot = document.getElementById('qualy-boot')
          var seat = boot && boot.firstElementChild
          var source = document.getElementById('qualy-boot-copy')
          if (!seat || !source) return
          shown = true
          var copy = JSON.parse(source.textContent)[locale]
          var note = document.createElement('p')
          note.textContent = kind === 'asset' ? copy.assetFailedLead : copy.reloadLead
          var reload = document.createElement('a')
          reload.href = location.href
          reload.textContent = copy.reload
          reload.addEventListener('click', function (event) {
            event.preventDefault()
            location.reload()
          })
          note.appendChild(reload)
          seat.appendChild(note)
        }
        setTimeout(function () {
          showRecovery('slow')
        }, 20000)
        window.addEventListener(
          'error',
          function (event) {
            var target = event.target
            if (!target || target === window || !target.tagName) return
            var tag = target.tagName
            var url =
              tag === 'SCRIPT'
                ? target.src
                : tag === 'LINK' && target.rel === 'stylesheet'
                  ? target.href
                  : ''
            if (!url || url.indexOf(location.origin + '/') !== 0) return
            showRecovery('asset')
          },
          true,
        )
      })()
    </script>
    <style id="qualy-boot-style">
      html {
        background: oklch(0.99 0.001 80);
      }
      html[data-mode='dark'] {
        background: oklch(0.17 0.006 80);
      }
      #qualy-boot {
        position: fixed;
        inset: 0;
        color: oklch(0.21 0.006 80);
      }
      html[data-mode='dark'] #qualy-boot {
        color: oklch(0.93 0.004 80);
      }
      #qualy-boot > div {
        position: absolute;
        top: var(--boot-top);
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #qualy-boot svg {
        display: block;
        flex-shrink: 0;
      }
      #qualy-boot p {
        margin: var(--boot-hint-gap) 0 0;
        font:
          14px/1.25rem system-ui,
          sans-serif;
      }
      #qualy-boot a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <!-- qualy-boot -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
