<!doctype html>
<html lang="zh-CN">
  <head>
    <style>
      @layer theme, base, mantine, components, priority1, priority2, priority3, priority4, priority5;
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Qualy: Plugin based comprehensive quality evaluation system"
    />
    <title>Qualy</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      ;(function () {
        var choice = null
        try {
          choice = localStorage.getItem('qualy.theme')
        } catch (error) {}
        var dark =
          choice === 'dark' ||
          (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        var root = document.documentElement
        root.setAttribute('data-mode', dark ? 'dark' : 'light')
        if (dark) root.classList.add('dark')
        root.style.colorScheme = dark ? 'dark' : 'light'
        setTimeout(function () {
          var boot = document.getElementById('qualy-boot')
          var seat = boot && boot.firstElementChild
          if (!seat) return
          var note = document.createElement('p')
          note.textContent = '加载时间较长，'
          var reload = document.createElement('a')
          reload.href = location.href
          reload.textContent = '刷新页面'
          reload.addEventListener('click', function (event) {
            event.preventDefault()
            location.reload()
          })
          note.appendChild(reload)
          seat.appendChild(note)
        }, 20000)
      })()
    </script>
    <style id="qualy-boot-style">
      html {
        background: oklch(0.99 0.001 80);
      }
      html[data-mode='dark'] {
        background: oklch(0.17 0.006 80);
      }
      #qualy-boot {
        position: fixed;
        inset: 0;
        color: oklch(0.21 0.006 80);
      }
      html[data-mode='dark'] #qualy-boot {
        color: oklch(0.93 0.004 80);
      }
      #qualy-boot > div {
        position: absolute;
        top: var(--boot-top);
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #qualy-boot svg {
        display: block;
        flex-shrink: 0;
      }
      #qualy-boot p {
        margin: var(--boot-hint-gap) 0 0;
        font:
          14px/1.25rem system-ui,
          sans-serif;
      }
      #qualy-boot a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <!-- qualy-boot -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
