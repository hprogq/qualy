# The staging bridge: everything the local stack does, PLUS a trace uplink
# to Tencent APM over its public OTLP gRPC/TLS endpoint.
#
# This is the config for verifying the cloud path from a development machine,
# before any server exists in the VPC. The local pipelines are identical to
# collector.local.yaml - selecting this file must not change what Grafana on
# :3001 sees - and the only addition is the second traces exporter. Metrics
# stay local in step one; the APM→TMP metric sync is configured in the
# Tencent console, and the in-VPC remote-write path (collector.production.yaml)
# waits until a collector actually lives in that VPC.
#
# Credentials come from the collector container's own environment
# (ops/observability/collector.env, gitignored; see collector.env.example) -
# never the application process, never this file:
#
#   TENCENT_APM_ENDPOINT   e.g. ap-beijing.apm.tencentcs.com:4320 (gRPC/TLS)
#   TENCENT_APM_TOKEN      the APM business system token
#
# Select it via the compose interpolation variable:
#   QUALY_COLLECTOR_CONFIG=collector.staging.yaml docker compose --profile observability up -d

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  # CLS OTLP/HTTP authenticates with HTTP Basic Auth over SecretId/SecretKey;
  # the extension builds the header from the collector's own environment, so
  # no encoded credential ever appears in a file. The defaults keep the
  # collector BOOTING when the CLS variables are not filled in yet - the
  # exporter then fails politely at runtime (401) without touching the
  # already-verified traces/metrics pipelines.
  basicauth/tencent_cls:
    client_auth:
      username: ${env:TENCENT_CLS_SECRET_ID:-unset}
      password: ${env:TENCENT_CLS_SECRET_KEY:-unset}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48
  batch:
    timeout: 2s
    send_batch_size: 512

exporters:
  otlp_grpc/local_lgtm:
    endpoint: otel-lgtm:4317
    tls:
      insecure: true
  otlp_grpc/tencent_apm:
    endpoint: ${env:TENCENT_APM_ENDPOINT}
    # the public 4320 endpoint speaks gRPC over TLS; the token rides the
    # authorization header on every export
    tls:
      insecure: false
    headers:
      authorization: ${env:TENCENT_APM_TOKEN}
  # Logs go to CLS directly over its public OTLP/HTTP endpoint - not through
  # APM, no LogListener, no machine group. The endpoint is a BASE url; the
  # exporter appends /v1/logs itself (if the console hands out an explicit
  # path one day, switch to logs_endpoint with the exact URL).
  otlp_http/tencent_cls:
    endpoint: ${env:TENCENT_CLS_ENDPOINT:-https://ap-beijing.cls.tencentcs.com}
    # CLS ignores Content-Encoding and proto-parses the raw bytes, so the
    # exporter's default gzip arrives as "invalid wire-format" (probed with
    # curl: identity 200, gzip 400) - compression stays off on this uplink
    compression: none
    auth:
      authenticator: basicauth/tencent_cls
    headers:
      topic_id: ${env:TENCENT_CLS_TOPIC_ID:-unset}

service:
  extensions: [health_check, basicauth/tencent_cls]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      # both worlds see the same spans: Tempo for the local loop, APM for
      # the staging verification
      exporters: [otlp_grpc/local_lgtm, otlp_grpc/tencent_apm]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      # step two, after traces were confirmed in the APM console: metrics
      # ride the same public APM uplink, and the console's sync rules decide
      # what continues into TMP - nothing here ever speaks to the VPC
      exporters: [otlp_grpc/local_lgtm, otlp_grpc/tencent_apm]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      # step three: both worlds again - Loki for the local loop, CLS over
      # its own public OTLP endpoint (never via APM, never a LogListener)
      exporters: [otlp_grpc/local_lgtm, otlp_http/tencent_cls]
