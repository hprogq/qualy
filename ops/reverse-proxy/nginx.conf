# The edge in front of one Qualy process, as an nginx server block.
#
# The same contract as the Caddyfile beside this file: terminate TLS, tell
# browsers to stay on https, forward the request with its origin intact for
# the application's own checks, and never buffer an event stream. What the
# application sets for itself (cache, sniffing, framing, referrer, the
# content security policy) passes through untouched.
#
# Replace the server name, the certificate paths and the upstream port.

upstream qualy {
    server 127.0.0.1:3000;
    # one pool of upstream connections rather than a handshake per request
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;
    server_name qualy.example.com;

    ssl_certificate     /etc/letsencrypt/live/qualy.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qualy.example.com/privkey.pem;

    # Every future visit goes straight to https, for a year, subdomains
    # included. Not `preload`: that list is a one-way door for the whole
    # registrable domain and a decision for its owner, not this file.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://qualy;
        proxy_http_version 1.1;

        # An attachment is one PUT of the whole file to this application's
        # own origin, and the product's own ceiling is 50 MiB per file
        # (storage's `maxFileBytes`). nginx defaults to 1m, which refused
        # every real upload at the edge with a 413 the application never saw
        # - so this has to be at least as large as the ceiling the product
        # actually enforces, with room for the request around it. Buffering
        # off so a large body is streamed rather than spooled to the proxy's
        # disk first.
        client_max_body_size 64m;
        proxy_request_buffering off;

        # The application judges where a request came from (the
        # request-origin guard, the websocket handshake) against the PUBLIC
        # host, and reads it from X-Forwarded-Host only when the peer is a
        # trusted proxy: forward Host as received, write the three
        # X-Forwarded-* headers, and set QUALY_TRUSTED_PROXIES on the
        # application side to this proxy's address (the peer the process
        # sees, e.g. 127.0.0.1), or none of these headers are believed.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Websocket upgrades (the formula editor's language bridge under
        # /api): the two headers an upgrade needs, forwarded when present
        # and empty otherwise; keepalive to the upstream wants an empty
        # Connection header on ordinary requests.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Server-sent events (the batch live channel) are an open response
        # that trickles; a buffered proxy would hold the first bytes until
        # the buffer fills, which for an event stream is never. The
        # application may also send X-Accel-Buffering: no per response.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}

# what $connection_upgrade resolves to: "upgrade" during a handshake, empty
# otherwise (belongs in the http {} block)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name qualy.example.com;
    return 301 https://$host$request_uri;
}
